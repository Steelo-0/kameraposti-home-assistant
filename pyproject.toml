[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kameraposti-home-assistant"
version = "1.0.0"
description = "Home Assistant custom integration receiving Kameraposti AI detection events over MQTT (WSS)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
dependencies = ["paho-mqtt>=2.1.0,<3.0.0"]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "pytest-homeassistant-custom-component",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
